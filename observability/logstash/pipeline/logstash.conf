input {
  tcp {
    port => 5000
    codec => json
  }
  
  udp {
    port => 5000
    codec => json
  }
}

filter {
  # Parse timestamp
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
  
  # Add service tag if not present
  if ![service] {
    mutate {
      add_field => { "service" => "unknown" }
    }
  }
  
  # Parse error stack traces
  if [stack] {
    mutate {
      add_tag => [ "has_stack_trace" ]
    }
  }
  
  # Add correlation ID tag
  if [correlationId] {
    mutate {
      add_tag => [ "has_correlation_id" ]
    }
  }
  
  # Categorize log levels
  if [level] == "error" {
    mutate {
      add_tag => [ "error" ]
    }
  } else if [level] == "warn" {
    mutate {
      add_tag => [ "warning" ]
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "commercesphere-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }
  
  # Debug output (optional)
  # stdout {
  #   codec => rubydebug
  # }
}
