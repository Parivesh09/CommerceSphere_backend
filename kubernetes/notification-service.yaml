# Notification Service Kubernetes Manifests

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: default
  labels:
    app: notification-service
    tier: backend
    component: notifications
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notification-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: notification-service
        tier: backend
        component: notifications
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: notification-service
        image: commercesphere/notification-service:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        
        env:
        # From ConfigMap
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: notification-service-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: notification-service-config
              key: PORT
        - name: SERVICE_NAME
          valueFrom:
            configMapKeyRef:
              name: notification-service-config
              key: SERVICE_NAME
        - name: NOTIFICATION_RETRY_ATTEMPTS
          valueFrom:
            configMapKeyRef:
              name: notification-service-config
              key: NOTIFICATION_RETRY_ATTEMPTS
        - name: NOTIFICATION_RETRY_DELAYS
          valueFrom:
            configMapKeyRef:
              name: notification-service-config
              key: NOTIFICATION_RETRY_DELAYS
        - name: EMAIL_ENABLED
          valueFrom:
            configMapKeyRef:
              name: notification-service-config
              key: EMAIL_ENABLED
        - name: SMS_ENABLED
          valueFrom:
            configMapKeyRef:
              name: notification-service-config
              key: SMS_ENABLED
        - name: PUSH_ENABLED
          valueFrom:
            configMapKeyRef:
              name: notification-service-config
              key: PUSH_ENABLED
        - name: SENDGRID_FROM_EMAIL
          valueFrom:
            configMapKeyRef:
              name: notification-service-config
              key: SENDGRID_FROM_EMAIL
        - name: SENDGRID_FROM_NAME
          valueFrom:
            configMapKeyRef:
              name: notification-service-config
              key: SENDGRID_FROM_NAME
        
        # Shared Config
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: LOG_LEVEL
        - name: LOG_FORMAT
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: LOG_FORMAT
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: KAFKA_BROKERS
        - name: JAEGER_AGENT_HOST
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: JAEGER_AGENT_HOST
        - name: JAEGER_AGENT_PORT
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: JAEGER_AGENT_PORT
        
        # From Secrets
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: notification-service-secrets
              key: database-url
        - name: SENDGRID_API_KEY
          valueFrom:
            secretKeyRef:
              name: notification-service-secrets
              key: sendgrid-api-key
        - name: TWILIO_ACCOUNT_SID
          valueFrom:
            secretKeyRef:
              name: notification-service-secrets
              key: twilio-account-sid
        - name: TWILIO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: notification-service-secrets
              key: twilio-auth-token
        - name: TWILIO_PHONE_NUMBER
          valueFrom:
            secretKeyRef:
              name: notification-service-secrets
              key: twilio-phone-number
        - name: FCM_SERVER_KEY
          valueFrom:
            secretKeyRef:
              name: notification-service-secrets
              key: fcm-server-key
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      
      securityContext:
        fsGroup: 1000

---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: default
  labels:
    app: notification-service
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  sessionAffinity: None

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notification-service-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notification-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
