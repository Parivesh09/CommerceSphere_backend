# Recommendation Service Kubernetes Manifests

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  namespace: default
  labels:
    app: recommendation-service
    tier: backend
    component: recommendations
spec:
  replicas: 3
  selector:
    matchLabels:
      app: recommendation-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: recommendation-service
        tier: backend
        component: recommendations
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: recommendation-service
        image: commercesphere/recommendation-service:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        
        env:
        # From ConfigMap
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: recommendation-service-config
              key: ENVIRONMENT
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: recommendation-service-config
              key: PORT
        - name: SERVICE_NAME
          valueFrom:
            configMapKeyRef:
              name: recommendation-service-config
              key: SERVICE_NAME
        - name: CACHE_TTL_RECOMMENDATIONS
          valueFrom:
            configMapKeyRef:
              name: recommendation-service-config
              key: CACHE_TTL_RECOMMENDATIONS
        - name: CACHE_TTL_TRENDING
          valueFrom:
            configMapKeyRef:
              name: recommendation-service-config
              key: CACHE_TTL_TRENDING
        - name: COLLABORATIVE_FILTERING_ENABLED
          valueFrom:
            configMapKeyRef:
              name: recommendation-service-config
              key: COLLABORATIVE_FILTERING_ENABLED
        - name: CONTENT_BASED_FILTERING_ENABLED
          valueFrom:
            configMapKeyRef:
              name: recommendation-service-config
              key: CONTENT_BASED_FILTERING_ENABLED
        - name: MIN_SIMILAR_USERS
          valueFrom:
            configMapKeyRef:
              name: recommendation-service-config
              key: MIN_SIMILAR_USERS
        - name: MAX_RECOMMENDATIONS
          valueFrom:
            configMapKeyRef:
              name: recommendation-service-config
              key: MAX_RECOMMENDATIONS
        - name: TRENDING_TIME_DECAY_HOURS
          valueFrom:
            configMapKeyRef:
              name: recommendation-service-config
              key: TRENDING_TIME_DECAY_HOURS
        - name: TRENDING_VIEW_WEIGHT
          valueFrom:
            configMapKeyRef:
              name: recommendation-service-config
              key: TRENDING_VIEW_WEIGHT
        - name: TRENDING_PURCHASE_WEIGHT
          valueFrom:
            configMapKeyRef:
              name: recommendation-service-config
              key: TRENDING_PURCHASE_WEIGHT
        - name: TRENDING_UPDATE_INTERVAL_SECONDS
          valueFrom:
            configMapKeyRef:
              name: recommendation-service-config
              key: TRENDING_UPDATE_INTERVAL_SECONDS
        
        # Shared Config
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: LOG_LEVEL
        - name: LOG_FORMAT
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: LOG_FORMAT
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: KAFKA_BROKERS
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: REDIS_PORT
        - name: JAEGER_AGENT_HOST
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: JAEGER_AGENT_HOST
        - name: JAEGER_AGENT_PORT
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: JAEGER_AGENT_PORT
        
        # From Secrets
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: recommendation-service-secrets
              key: database-url
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: shared-secrets
              key: redis-password
              optional: true
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      
      securityContext:
        fsGroup: 1000

---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-service
  namespace: default
  labels:
    app: recommendation-service
spec:
  type: ClusterIP
  selector:
    app: recommendation-service
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  sessionAffinity: None

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: recommendation-service-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: recommendation-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
