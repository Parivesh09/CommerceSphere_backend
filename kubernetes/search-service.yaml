# Search Service Kubernetes Manifests

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: default
  labels:
    app: search-service
    tier: backend
    component: search
spec:
  replicas: 3
  selector:
    matchLabels:
      app: search-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: search-service
        tier: backend
        component: search
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: search-service
        image: commercesphere/search-service:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        
        env:
        # From ConfigMap
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: search-service-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: search-service-config
              key: PORT
        - name: SERVICE_NAME
          valueFrom:
            configMapKeyRef:
              name: search-service-config
              key: SERVICE_NAME
        - name: ES_INDEX_NAME
          valueFrom:
            configMapKeyRef:
              name: search-service-config
              key: ES_INDEX_NAME
        - name: ES_MAX_RESULTS
          valueFrom:
            configMapKeyRef:
              name: search-service-config
              key: ES_MAX_RESULTS
        - name: SEARCH_CACHE_TTL
          valueFrom:
            configMapKeyRef:
              name: search-service-config
              key: SEARCH_CACHE_TTL
        - name: AUTOCOMPLETE_MIN_LENGTH
          valueFrom:
            configMapKeyRef:
              name: search-service-config
              key: AUTOCOMPLETE_MIN_LENGTH
        - name: FUZZY_MATCH_ENABLED
          valueFrom:
            configMapKeyRef:
              name: search-service-config
              key: FUZZY_MATCH_ENABLED
        - name: FUZZY_MAX_EDITS
          valueFrom:
            configMapKeyRef:
              name: search-service-config
              key: FUZZY_MAX_EDITS
        - name: INDEX_BATCH_SIZE
          valueFrom:
            configMapKeyRef:
              name: search-service-config
              key: INDEX_BATCH_SIZE
        - name: INDEX_TIMEOUT_SECONDS
          valueFrom:
            configMapKeyRef:
              name: search-service-config
              key: INDEX_TIMEOUT_SECONDS
        
        # Shared Config
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: LOG_LEVEL
        - name: LOG_FORMAT
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: LOG_FORMAT
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: KAFKA_BROKERS
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: REDIS_PORT
        - name: ELASTICSEARCH_HOST
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: ELASTICSEARCH_HOST
        - name: ELASTICSEARCH_PORT
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: ELASTICSEARCH_PORT
        - name: JAEGER_AGENT_HOST
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: JAEGER_AGENT_HOST
        - name: JAEGER_AGENT_PORT
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: JAEGER_AGENT_PORT
        
        # From Secrets
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: shared-secrets
              key: redis-password
              optional: true
        - name: ELASTICSEARCH_USERNAME
          valueFrom:
            secretKeyRef:
              name: shared-secrets
              key: elasticsearch-username
              optional: true
        - name: ELASTICSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: shared-secrets
              key: elasticsearch-password
              optional: true
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      
      securityContext:
        fsGroup: 1000

---
apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: default
  labels:
    app: search-service
spec:
  type: ClusterIP
  selector:
    app: search-service
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  sessionAffinity: None

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: search-service-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: search-service
  minReplicas: 3
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 3
        periodSeconds: 30
      selectPolicy: Max
