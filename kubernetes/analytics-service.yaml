# Analytics Service Kubernetes Manifests

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: default
  labels:
    app: analytics-service
    tier: backend
    component: analytics
spec:
  replicas: 3
  selector:
    matchLabels:
      app: analytics-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: analytics-service
        tier: backend
        component: analytics
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: analytics-service
        image: commercesphere/analytics-service:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        
        env:
        # From ConfigMap
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: analytics-service-config
              key: NODE_ENV
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: analytics-service-config
              key: PORT
        - name: SERVICE_NAME
          valueFrom:
            configMapKeyRef:
              name: analytics-service-config
              key: SERVICE_NAME
        - name: TIMESCALE_ENABLED
          valueFrom:
            configMapKeyRef:
              name: analytics-service-config
              key: TIMESCALE_ENABLED
        - name: BATCH_AGGREGATION_INTERVAL_SECONDS
          valueFrom:
            configMapKeyRef:
              name: analytics-service-config
              key: BATCH_AGGREGATION_INTERVAL_SECONDS
        - name: REALTIME_METRICS_ENABLED
          valueFrom:
            configMapKeyRef:
              name: analytics-service-config
              key: REALTIME_METRICS_ENABLED
        - name: RAW_EVENTS_RETENTION_DAYS
          valueFrom:
            configMapKeyRef:
              name: analytics-service-config
              key: RAW_EVENTS_RETENTION_DAYS
        - name: AGGREGATED_DATA_RETENTION_DAYS
          valueFrom:
            configMapKeyRef:
              name: analytics-service-config
              key: AGGREGATED_DATA_RETENTION_DAYS
        
        # Shared Config
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: LOG_LEVEL
        - name: LOG_FORMAT
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: LOG_FORMAT
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: KAFKA_BROKERS
        - name: JAEGER_AGENT_HOST
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: JAEGER_AGENT_HOST
        - name: JAEGER_AGENT_PORT
          valueFrom:
            configMapKeyRef:
              name: shared-config
              key: JAEGER_AGENT_PORT
        
        # From Secrets
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: analytics-service-secrets
              key: database-url
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      
      securityContext:
        fsGroup: 1000

---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: default
  labels:
    app: analytics-service
spec:
  type: ClusterIP
  selector:
    app: analytics-service
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  sessionAffinity: None

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: analytics-service-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: analytics-service
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max
