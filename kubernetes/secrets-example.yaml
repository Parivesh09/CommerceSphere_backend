# Kubernetes Secrets Configuration Example
# 
# IMPORTANT: Never commit actual secrets to version control!
# This is an example template showing the structure.
#
# To create secrets:
# 1. Base64 encode your values: echo -n "your-secret" | base64
# 2. Replace the placeholder values below
# 3. Apply: kubectl apply -f secrets.yaml
#
# Or use kubectl create secret:
# kubectl create secret generic auth-service-secrets \
#   --from-literal=jwt-secret=your-jwt-secret \
#   --from-literal=database-url=postgresql://... \
#   --from-literal=encryption-key=your-encryption-key

---
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
  namespace: default
type: Opaque
stringData:
  # JWT Configuration
  jwt-secret: "your-jwt-secret-change-in-production"
  
  # Database Connection
  database-url: "postgresql://user:password@postgres:5432/auth_db"
  
  # Encryption Key (min 32 characters)
  encryption-key: "your-encryption-key-min-32-chars"

---
apiVersion: v1
kind: Secret
metadata:
  name: payment-service-secrets
  namespace: default
type: Opaque
stringData:
  # Database Connection
  database-url: "postgresql://user:password@postgres:5432/payment_db"
  
  # Stripe API Keys
  stripe-secret-key: "sk_live_..."
  stripe-webhook-secret: "whsec_..."
  
  # Encryption Key
  encryption-key: "your-encryption-key-min-32-chars"

---
apiVersion: v1
kind: Secret
