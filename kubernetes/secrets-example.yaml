  database-url: "postgresql://user:password@postgres:5432/notification_db"
  
  # SendGrid
  sendgrid-api-key: "SG...."
  
  # Twilio
  twilio-account-sid: "AC..."
  twilio-auth-token: "..."
  twilio-phone-number: "+1234567890"
  
  # Firebase Cloud Messaging
  fcm-server-key: "..."

---
apiVersion: v1
kind: Secret
metadata:
  name: product-service-secrets
  namespace: default
type: Opaque
stringData:
  # Database Connection
  database-url: "postgresql://user:password@postgres:5432/product_db"
  
  # Redis Connection
  redis-url: "redis://:password@redis:6379"
  
