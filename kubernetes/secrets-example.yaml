---
apiVersion: v1
kind: Secret
metadata:
  name: shared-secrets
  namespace: default
type: Opaque
stringData:
  # Kafka
  kafka-brokers: "kafka-1:9092,kafka-2:9092,kafka-3:9092"
  kafka-username: "kafka-user"
  kafka-password: "kafka-password"
  
  # Redis (shared cache)
  redis-password: "your-redis-password"
  
  # Elasticsearch
  elasticsearch-username: "elastic"
  elasticsearch-password: "your-elasticsearch-password"

---
# TLS Certificates
apiVersion: v1
kind: Secret
metadata:
  name: tls-certificates
  namespace: default
type: kubernetes.io/tls
data:
  # Base64 encoded certificate and key
  tls.crt: LS0tLS1CRUdJTi...
  tls.key: LS0tLS1CRUdJTi...

---
# Example Deployment using secrets
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: commercesphere/auth-service:latest
        ports:
        - containerPort: 3000
        env:
        # Security Configuration
        - name: NODE_ENV
          value: "production"
        - name: TLS_ENABLED
          value: "true"
        - name: CORS_ENABLED
          value: "true"
        - name: CORS_ALLOWED_ORIGINS
          value: "https://app.commercesphere.com,https://admin.commercesphere.com"
        - name: CSRF_ENABLED
          value: "true"
        - name: RATE_LIMIT_ENABLED
          value: "false"  # Handled by API Gateway
        - name: ENCRYPTION_ENABLED
          value: "true"
        
        # Secrets from Kubernetes Secrets
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: auth-service-secrets
              key: jwt-secret
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: auth-service-secrets
              key: database-url
        - name: ENCRYPTION_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: auth-service-secrets
              key: encryption-key
        
        # TLS Certificates (mounted as volumes)
        volumeMounts:
        - name: tls-certs
          mountPath: /etc/tls
          readOnly: true
        
        # Resource limits
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
            scheme: HTTPS
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 5
      
      volumes:
      - name: tls-certs
        secret:
          secretName: tls-certificates
      
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

---
# Network Policy for service isolation
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-service-network-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: auth-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic from API Gateway
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway
    ports:
    - protocol: TCP
      port: 3000
  egress:
  # Allow traffic to PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  # Allow traffic to Redis
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  # Allow DNS
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
