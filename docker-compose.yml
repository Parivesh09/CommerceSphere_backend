services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: commercesphere-postgres
    environment:
      POSTGRES_USER: commercesphere
      POSTGRES_PASSWORD: commercesphere_dev
      POSTGRES_DB: commercesphere
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commercesphere"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: commercesphere-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper (required for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: commercesphere-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log

  # Kafka Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: commercesphere-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Elasticsearch for Search Service
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: commercesphere-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # API Gateway
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: commercesphere-gateway
    depends_on:
      - redis
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      JWT_SECRET: dev-secret-change-in-production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth:3001
      PRODUCT_SERVICE_URL: http://product:3002
      ORDER_SERVICE_URL: http://order:3003
      PAYMENT_SERVICE_URL: http://payment:3004
      NOTIFICATION_SERVICE_URL: http://notification:3005
      SEARCH_SERVICE_URL: http://search:3006
      RECOMMENDATION_SERVICE_URL: http://recommendation:3007
      ANALYTICS_SERVICE_URL: http://analytics:3008
      CART_SERVICE_URL: http://cart:3009
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auth Service
  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: commercesphere-auth
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      JWT_SECRET: dev-secret-change-in-production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: auth_service
      DB_USER: commercesphere
      DB_PASSWORD: commercesphere_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379

  # Product Service
  product:
    build:
      context: .
      dockerfile: services/product/Dockerfile
    container_name: commercesphere-product
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: product_service
      DB_USER: commercesphere
      DB_PASSWORD: commercesphere_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9093
      AWS_REGION: us-east-1
      S3_BUCKET: commercesphere-products-dev
      S3_ENDPOINT: http://localhost:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      CDN_BASE_URL: http://localhost:9000
      LOW_STOCK_THRESHOLD: 10

  # Order Service
  order:
    build:
      context: .
      dockerfile: services/order/Dockerfile
    container_name: commercesphere-order
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: order_service
      DB_USER: commercesphere
      DB_PASSWORD: commercesphere_dev
      KAFKA_BROKERS: kafka:9093
      KAFKA_CLIENT_ID: order-service
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Payment Service
  payment:
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    container_name: commercesphere-payment
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://commercesphere:commercesphere_dev@postgres:5432/payment_service
      KAFKA_BROKERS: kafka:9093
      ORDER_SERVICE_URL: http://order:3003
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3004/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Notification Service
  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: commercesphere-notification
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "3005:3005"
    environment:
      PORT: 3005
      DATABASE_URL: postgresql://commercesphere:commercesphere_dev@postgres:5432/notification_service
      KAFKA_BROKERS: kafka:9093
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3005/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Search Service
  search:
    build:
      context: .
      dockerfile: services/search/Dockerfile
    container_name: commercesphere-search
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "3006:3006"
    environment:
      PORT: 3006
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9093
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3006/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Recommendation Service
  recommendation:
    build:
      context: .
      dockerfile: services/recommendation/Dockerfile
    container_name: commercesphere-recommendation
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "3007:3007"
    environment:
      PORT: 3007
      database_url: postgresql://commercesphere:commercesphere_dev@postgres:5432/recommendation_service
      redis_url: redis://redis:6379
      kafka_brokers: kafka:9093
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3007/health').read()"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Analytics Service
  analytics:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    container_name: commercesphere-analytics
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "3008:3008"
    environment:
      PORT: 3008
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: analytics_service
      DB_USER: commercesphere
      DB_PASSWORD: commercesphere_dev
      KAFKA_BROKERS: kafka:9093
      KAFKA_CLIENT_ID: analytics-service
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3008/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Cart Service
  cart:
    build:
      context: .
      dockerfile: services/cart/Dockerfile
    container_name: commercesphere-cart
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3009:3009"
    environment:
      PORT: 3009
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cart_service
      DB_USER: commercesphere
      DB_PASSWORD: commercesphere_dev
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3009/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  elasticsearch_data:
